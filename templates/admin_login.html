{% extends "base.html" %}

{% block title %}Administrative Portal Login – LifeSaver Blood Bank{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white text-center py-4">
                    <div class="brand-icon-box bg-danger mx-auto mb-2">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h4 class="fw-bold mb-1 text-white">Clinical Admin Portal</h4>
                    <span class="text-white-50 small">Restricted to authorized blood bank staff</span>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="admin" value="admin" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="admin123" value="admin123" required>
                            </div>
                            <span class="form-text text-muted small">Default College Demo: <code>admin</code> / <code>admin123</code></span>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 py-2 fw-bold mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Access Administration Dashboard
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
