{% extends "base.html" %}

{% block title %}Patient / Hospital Registration – LifeSaver Blood Bank{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow rounded-4 overflow-hidden">
                <div class="card-header bg-navy text-white p-4">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-hospital text-danger fs-3"></i>
                        <div>
                            <h4 class="fw-bold mb-0 text-white">Patient &amp; Hospital Registration</h4>
                            <span class="text-white-50 small">Create an account to submit and track urgent blood transfusion requisitions</span>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-md-5 bg-white">
                    <form method="POST" action="{{ url_for('patient_register') }}">
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Patient Full Name <span class="text-danger">*</span></label>
                                <input type="text" name="full_name" class="form-control" placeholder="e.g. Robert Sterling" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold small">Age <span class="text-danger">*</span></label>
                                <input type="number" name="age" class="form-control" placeholder="52" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold small">Gender <span class="text-danger">*</span></label>
                                <select name="gender" class="form-select" required>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Blood Group <span class="text-danger">*</span></label>
                                <select name="blood_group" class="form-select fw-bold text-danger" required>
                                    <option value="A+">A Positive (A+)</option>
                                    <option value="A-">A Negative (A-)</option>
                                    <option value="B+">B Positive (B+)</option>
                                    <option value="B-">B Negative (B-)</option>
                                    <option value="AB+">AB Positive (AB+)</option>
                                    <option value="AB-">AB Negative (AB-)</option>
                                    <option value="O+">O Positive (O+)</option>
                                    <option value="O-">O Negative (O-)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Emergency Contact Number <span class="text-danger">*</span></label>
                                <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                                <input type="email" name="email" class="form-control" placeholder="patient@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Admitted Hospital / Clinic <span class="text-danger">*</span></label>
                                <input type="text" name="hospital_name" class="form-control" placeholder="e.g. Central Metropolitan Hospital" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Account Password <span class="text-danger">*</span></label>
                                <input type="password" name="password" class="form-control" minlength="6" placeholder="Choose a password" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="{{ url_for('patient_login') }}" class="text-decoration-none small text-muted">
                                Already registered? <strong class="text-danger">Log in</strong>
                            </a>
                            <button type="submit" class="btn btn-danger px-4 py-2 fw-bold">
                                <i class="bi bi-check2-circle me-1"></i> Register Patient Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
